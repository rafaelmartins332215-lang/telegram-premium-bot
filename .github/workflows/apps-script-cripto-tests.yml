name: Testes do Scanner Cripto
on:
  push:
    paths: ['apps-script-cripto/**', '.github/workflows/apps-script-cripto-tests.yml']
  pull_request:
    paths: ['apps-script-cripto/**', '.github/workflows/apps-script-cripto-tests.yml']
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps-script-cripto/tests/run.js
