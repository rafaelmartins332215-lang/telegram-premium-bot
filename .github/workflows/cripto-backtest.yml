# Roda o backtest das estratégias de cripto com dados reais da Binance.
# O resultado aparece no resumo da execução e como artefato para download.
name: Backtest cripto
on:
  push:
    paths: ['backtest/**', '.github/workflows/cripto-backtest.yml']
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backtest/requirements.txt
      - uses: actions/cache@v4
        with:
          path: backtest/dados
          key: binance-dados-${{ hashFiles('backtest/cripto_backtest.py') }}
          restore-keys: binance-dados-
      - name: Backtest
        run: |
          python backtest/cripto_backtest.py --saida relatorio_backtest.md
          cat relatorio_backtest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Backtest day trade
        run: |
          python backtest/daytrade_backtest.py --saida relatorio_daytrade.md
          cat relatorio_daytrade.md >> "$GITHUB_STEP_SUMMARY"
      - name: Backtest estratégias profissionais
        run: |
          python backtest/pro_backtest.py --saida relatorio_pro.md
          cat relatorio_pro.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rodada focada
        run: |
          python backtest/foco_backtest.py --saida relatorio_foco.md
          cat relatorio_foco.md >> "$GITHUB_STEP_SUMMARY"
      - name: Busca da melhor versão
        run: |
          python backtest/melhor_backtest.py --saida relatorio_melhor.md
          cat relatorio_melhor.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-cripto
          path: relatorio_*
